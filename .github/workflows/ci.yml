name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test with Testcontainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Docker images in parallel
        run: |
          # The test images are declared once, in internal/testx/constants.go;
          # pulling what it declares keeps this list from drifting behind it.
          mapfile -t images < <(sed -nE 's/^[[:space:]]*[A-Za-z]+Image[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/testx/constants.go)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No test images found in internal/testx/constants.go" >&2
            exit 1
          fi
          images+=("testcontainers/ryuk:0.13.0")

          pull_pids=()
          pull_status=0

          for image in "${images[@]}"; do
            docker pull "$image" &
            pull_pids+=("$!")
          done

          for pull_pid in "${pull_pids[@]}"; do
            if ! wait "$pull_pid"; then
              pull_status=1
            fi
          done

          exit "$pull_status"

      - name: Download Go modules
        run: go mod download

      - name: Run Tests with Coverage
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic -timeout 30m ./...
        env:
          TZ: Asia/Shanghai
          VEF_I18N_LANGUAGE: en
          VEF_LOG_LEVEL: error
          TESTCONTAINERS_RYUK_DISABLED: false
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -af --volumes || true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The 5m default was exceeded on a cold cache (318s) as the repo grew,
          # which fails the run regardless of findings.
          args: --timeout=15m

  modernize:
    name: Modernize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run modernize analyzer
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
