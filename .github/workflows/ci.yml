name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test with Testcontainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Docker images in parallel
        run: |
          pull_pids=()
          pull_status=0

          docker pull testcontainers/ryuk:0.13.0 &
          pull_pids+=("$!")
          docker pull postgres:18-alpine &
          pull_pids+=("$!")
          docker pull mysql:lts &
          pull_pids+=("$!")
          docker pull redis:8-alpine &
          pull_pids+=("$!")
          docker pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z &
          pull_pids+=("$!")

          for pull_pid in "${pull_pids[@]}"; do
            if ! wait "$pull_pid"; then
              pull_status=1
            fi
          done

          exit "$pull_status"

      - name: Download Go modules
        run: go mod download

      - name: Run Tests with Coverage
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic -timeout 30m ./...
        env:
          TZ: Asia/Shanghai
          VEF_I18N_LANGUAGE: en
          VEF_LOG_LEVEL: error
          TESTCONTAINERS_RYUK_DISABLED: false
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -af --volumes || true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # The 5m default was exceeded on a cold cache (318s) as the repo grew,
          # which fails the run regardless of findings.
          args: --timeout=15m

  modernize:
    name: Modernize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Run modernize analyzer
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
