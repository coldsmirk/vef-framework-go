name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test with Testcontainers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Docker images in parallel
        run: |
          docker pull testcontainers/ryuk:0.13.0 &
          docker pull postgres:18-alpine &
          docker pull mysql:lts &
          docker pull redis:8-alpine &
          docker pull minio/minio:latest &
          wait

      - name: Download Go modules
        run: go mod download

      - name: Run Tests with Coverage
        run: go test -v -race -coverpkg=./... -coverprofile=coverage.txt -covermode=atomic -timeout 30m ./...
        env:
          TZ: Asia/Shanghai
          VEF_I18N_LANGUAGE: en
          VEF_LOG_LEVEL: error
          TESTCONTAINERS_RYUK_DISABLED: false
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker system prune -af --volumes || true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  modernize:
    name: Modernize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run modernize analyzer
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [test, lint, modernize]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          git fetch --force --tags origin

          # Get the most recent release tag (excluding the current one being created)
          PREVIOUS_TAG=$(gh api repos/${{ github.repository }}/releases \
            --jq '.[].tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            | grep -vx "$CURRENT_TAG" \
            | head -1)

          if [ -n "$PREVIOUS_TAG" ]; then
            git rev-parse --verify "${PREVIOUS_TAG}^{commit}" >/dev/null
          fi
          git rev-parse --verify "${CURRENT_TAG}^{commit}" >/dev/null

          echo "Generating changelog from ${PREVIOUS_TAG} to ${CURRENT_TAG}"

          FEATURES=""
          FIXES=""
          DOCS=""
          CHORE=""
          REFACTOR=""
          TEST=""
          CI=""
          OTHER=""

          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s" $CURRENT_TAG)
          else
            COMMITS=$(git log --pretty=format:"%s" ${PREVIOUS_TAG}..${CURRENT_TAG})
          fi

          while IFS= read -r commit; do
            case "$commit" in
              feat:*|feat\(*)
                FEATURES="${FEATURES}- ${commit#feat*: }\n"
                ;;
              fix:*|fix\(*)
                FIXES="${FIXES}- ${commit#fix*: }\n"
                ;;
              docs:*|docs\(*)
                DOCS="${DOCS}- ${commit#docs*: }\n"
                ;;
              chore:*|chore\(*)
                CHORE="${CHORE}- ${commit#chore*: }\n"
                ;;
              refactor:*|refactor\(*)
                REFACTOR="${REFACTOR}- ${commit#refactor*: }\n"
                ;;
              test:*|test\(*)
                TEST="${TEST}- ${commit#test*: }\n"
                ;;
              ci:*|ci\(*)
                CI="${CI}- ${commit#ci*: }\n"
                ;;
              *)
                OTHER="${OTHER}- ${commit}\n"
                ;;
            esac
          done <<< "$COMMITS"

          CHANGELOG="## What's Changed\n\n"

          [ -n "$FEATURES" ] && CHANGELOG="${CHANGELOG}### 🚀 New Features\n${FEATURES}\n"
          [ -n "$FIXES" ] && CHANGELOG="${CHANGELOG}### 🐛 Bug Fixes\n${FIXES}\n"
          [ -n "$REFACTOR" ] && CHANGELOG="${CHANGELOG}### ♻️ Refactoring\n${REFACTOR}\n"
          [ -n "$CI" ] && CHANGELOG="${CHANGELOG}### 🔄 CI/CD\n${CI}\n"
          [ -n "$TEST" ] && CHANGELOG="${CHANGELOG}### ✅ Testing\n${TEST}\n"
          [ -n "$DOCS" ] && CHANGELOG="${CHANGELOG}### 📝 Documentation\n${DOCS}\n"
          [ -n "$CHORE" ] && CHANGELOG="${CHANGELOG}### 🔧 Maintenance\n${CHORE}\n"
          [ -n "$OTHER" ] && CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n"

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          generate_release_notes: true
          draft: false
          prerelease: false
